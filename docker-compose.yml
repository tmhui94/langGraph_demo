services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hragent
      POSTGRES_USER: hragent
      POSTGRES_PASSWORD: hragent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hragent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://hragent:hragent@postgres:5432/hragent
      CORS_ORIGINS: http://localhost:5173
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
